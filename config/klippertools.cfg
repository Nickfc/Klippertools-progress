# Klippertools Suite
# Include this file from printer.cfg after installing the Python extras.

[probe_progress]
# The first accepted logical points used to calculate the ETA.
eta_seed_points: 3

# Maximum XY difference, in millimetres, between a generated point and the
# physical result event before the event is ignored.
coordinate_tolerance: 0.75

[nozzle_guard]
# block: stop a confirmed mismatch; warn: allow with a warning; off: disable.
# Files without readable nozzle metadata are allowed with an unknown status.
mode: block
tolerance: 0.01
scan_bytes: 524288

[start_flow]
# Starting estimates are refined in memory after each completed startup.
learning_rate: 0.30
bed_heat_estimate: 120
homing_estimate: 35
mesh_estimate: 180
nozzle_heat_estimate: 90
purge_estimate: 20

[motion_wizard]

[service_metrics]
# Motion distance is commanded travel reported by Klipper, not encoder or
# other closed-loop physical feedback. Persistent counters and service
# intervals are configured in Mainsail's Klippertools view.

[thermal_soak]
# Thermal Soak auto-detects configured Klipper temperature sensors. The
# defaults are intentionally conservative and may be overridden per command.
default_sensor: heater_bed
stability_window: 300
max_wait: 1800
temperature_tolerance: 0.30
# Maximum absolute regression slope in degrees Celsius per minute.
slope_limit: 0.05
# Maximum temperature span during the complete stability window.
range_limit: 0.50
sample_interval: 2

[calibration_center]
# All calibration workflows are attended and require explicit confirmation.
# Results that Klipper can persist remain pending until SAVE_CONFIG is issued
# separately after review.
