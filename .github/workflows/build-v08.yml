name: Build v0.8 Mainsail

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: v08-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and validate both Mainsail versions
        run: scripts/build-mainsail-v0.8.0.sh "$RUNNER_TEMP/klippertools-v0.8.0-mainsail"
      - name: Upload version-matched builds
        uses: actions/upload-artifact@v4
        with:
          name: klippertools-v0.8.0-mainsail-${{ github.sha }}
          path: ${{ runner.temp }}/klippertools-v0.8.0-mainsail/
          if-no-files-found: error
          retention-days: 3
